<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <title>Tạo thư mới</title>
  <link rel="icon" type="image/png" href="/image/logo.png" />
  <script src="/js/lib/tailwind/tailwind.js"></script>
  <script src="/js/lib/tailwind/tailwind.config.js"></script>
  <link href="/js/lib/quill/quill.snow.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: header}">...</div>
<div class="flex">
  <div th:replace="~{fragments/drawer :: drawer}">...</div>
  <div class="min-h-screen rounded-lg flex flex-col flex-1 bg-gray-50 p-10">

    <!-- Thông báo lỗi từ server nếu có -->
    <div th:if="${param.error != null or error != null}"
         class="flex items-start gap-2 p-4 mb-6 text-sm text-red-800 bg-red-50 border border-red-200 rounded-lg shadow-sm">
      <svg class="w-4 h-4 mt-0.5 flex-shrink-0 text-red-600" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
      </svg>
      <span th:text="${param.error != null ? param.error : error}">Địa chỉ email người nhận không tồn tại!</span>
    </div>

    <form id="mailForm" action="/send" method="post" enctype="multipart/form-data">
      <!-- Người nhận -->
      <div class="mb-6 relative">
        <label
                class="block w-fit top-[-12px] left-[20px] absolute bg-gray-50 px-1 text-sm font-medium text-gray-900"
                for="toAddress"
        >Người nhận <span class="text-red-500">*</span></label
        >
        <input
                class="border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 transition"
                id="toAddress"
                name="toAddress"
                placeholder="user1@domain1.com"
                required
                th:value="${email.toAddress}"
                type="text"
                autocomplete="off"
        />
        <!-- Thông báo kiểm tra email người nhận -->
        <div id="toAddressFeedback" class="mt-1.5 min-h-[20px]">
          <p id="toAddressChecking" class="text-xs text-blue-600 font-medium hidden flex items-center gap-1.5">
            <svg class="animate-spin h-3.5 w-3.5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            <span>Đang kiểm tra địa chỉ người nhận...</span>
          </p>
          <p id="toAddressError" class="text-xs text-red-600 font-medium hidden flex items-center gap-1.5">
            <svg class="w-4 h-4 text-red-600 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
            </svg>
            <span id="toAddressErrorText">Địa chỉ email người nhận không tồn tại!</span>
          </p>
          <p id="toAddressSuccess" class="text-xs text-green-600 font-medium hidden flex items-center gap-1.5">
            <svg class="w-4 h-4 text-green-600 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
            </svg>
            <span id="toAddressSuccessText">Email người nhận hợp lệ</span>
          </p>
        </div>
      </div>

      <!-- Tiêu đề -->
      <div class="mb-6 relative">
        <label
                class="block w-fit top-[-12px] left-[20px] absolute bg-gray-50 px-1 text-sm font-medium text-gray-900"
                for="subject"
        >Tiêu đề <span class="text-red-500">*</span></label
        >
        <input
                class="border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                id="subject"
                name="subject"
                required
                th:value="${email.subject}"
                type="text"
        />
      </div>

      <!-- Nội dung -->
      <div class="mb-6 relative">
        <label
                class="block w-fit top-[-12px] left-[20px] absolute bg-gray-50 px-1 text-sm font-medium text-gray-900"
                for="content"
        >Nội dung</label
        >
        <input name="content" type="hidden"/>
        <div
                class="bg-white rounded-lg cursor-text h-[20rem] overflow-y-auto"
                id="content"
                name="content"
        ></div>
      </div>

      <!-- File đính kèm -->
      <div class="mb-6 relative">
        <label
                class="block mb-2 text-sm font-medium text-gray-900"
                for="file"
        >File đính kèm (tùy chọn - tối đa 15 MB: hỗ trợ ảnh, video, tài liệu)</label>
        <input
                class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 focus:outline-none"
                id="file"
                name="file"
                type="file"
                onchange="showFileName(this)"
        />
        <div id="file-name-preview" class="mt-2.5 hidden p-3 bg-white border border-gray-200 rounded-lg shadow-sm">
          <div class="flex items-center justify-between text-xs text-gray-700">
            <span class="flex items-center gap-1.5 font-medium">📎 <span id="file-name-text"></span></span>
            <button type="button" onclick="clearFile()" class="text-red-500 hover:text-red-700 hover:underline font-medium">Xóa file</button>
          </div>
          <div id="file-media-preview" class="mt-2 hidden"></div>
        </div>
      </div>

      <!-- Nút gửi -->
      <div class="flex justify-center">
        <button
                id="btn-submit"
                class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center transition"
                type="submit"
        >
          Gửi
        </button>
      </div>
    </form>
  </div>
</div>

<script src="/js/lib/quill/quill.js"></script>
<script th:inline="javascript">
  const quill = new Quill('#content', {
    theme: 'snow',
    modules: {
      toolbar:
              [
                [{'header': [1, 2, 3, 4, 5, 6, false]}],
                [{'font': []}],
                [{'size': ['small', false, 'large', 'huge']}],
                ['bold', 'italic', 'underline', 'strike'],
                ['blockquote', 'code-block'],
                [{'align': []}],
                [{'list': 'ordered'}, {'list': 'bullet'}],
                [{'indent': '-1'}, {'indent': '+1'}],
                [{'color': []}, {'background': []}],
                ['clean']
              ]
    },
  });
  /*<![CDATA[*/
  const email = /*[[${email}]]*/ {};
  /*]]>*/
  if (email && email.content) {
    try {
      quill.setContents(JSON.parse(email.content));
    } catch (e) {
      quill.setText(email.content);
    }
  }
  document.querySelector("#content").onclick = () => {
    quill.focus();
  };

  // ── Hiển thị tên file và xem trước trực tiếp sau khi chọn ──
  function showFileName(input) {
    const preview = document.getElementById('file-name-preview');
    const nameEl  = document.getElementById('file-name-text');
    const mediaPreview = document.getElementById('file-media-preview');
    mediaPreview.innerHTML = '';
    mediaPreview.classList.add('hidden');

    if (input.files && input.files.length > 0) {
      const file = input.files[0];
      const maxAllowed = 15 * 1024 * 1024; // 15 MB
      if (file.size > maxAllowed) {
        alert('File đính kèm vượt quá dung lượng tối đa 15 MB (' + (file.size / (1024 * 1024)).toFixed(1) + ' MB).\nVui lòng chọn file nhỏ hơn hoặc bằng 15 MB để tránh lãng phí tài nguyên hệ thống.');
        clearFile();
        return;
      }

      const sizeKb = (file.size / 1024).toFixed(1);
      const sizeMb = (file.size / (1024 * 1024)).toFixed(2);
      const displaySize = file.size >= 1024 * 1024 ? (sizeMb + ' MB') : (sizeKb + ' KB');
      nameEl.textContent = file.name + ' (' + displaySize + ')';
      preview.classList.remove('hidden');

      // Xem trước ảnh trực tiếp khi vừa chọn
      if (file.type.startsWith('image/') || /\.(jpe?g|png|gif|webp|bmp|svg)$/i.test(file.name)) {
        const url = URL.createObjectURL(file);
        mediaPreview.innerHTML = `
          <div class="mt-2 p-2 bg-gray-50 rounded-lg border border-gray-200 inline-block">
            <p class="text-[11px] text-gray-500 mb-1 font-medium flex items-center gap-1">🖼 Xem trước ảnh:</p>
            <img src="${url}" alt="Preview" class="max-h-56 rounded object-contain shadow-sm" />
          </div>
        `;
        mediaPreview.classList.remove('hidden');
      }
      // Xem trước video trực tiếp khi vừa chọn
      else if (file.type.startsWith('video/') || /\.(mp4|webm|ogg|mov|mkv)$/i.test(file.name)) {
        const url = URL.createObjectURL(file);
        mediaPreview.innerHTML = `
          <div class="mt-2 p-2 bg-black rounded-lg border border-gray-700 max-w-lg shadow-md">
            <p class="text-[11px] text-gray-300 mb-1.5 px-1 font-medium flex items-center gap-1">🎬 Xem trước video:</p>
            <video controls src="${url}" class="w-full max-h-60 rounded bg-black"></video>
          </div>
        `;
        mediaPreview.classList.remove('hidden');
      }
    } else {
      preview.classList.add('hidden');
    }
  }

  function clearFile() {
    document.getElementById('file').value = '';
    document.getElementById('file-name-preview').classList.add('hidden');
    const mediaPreview = document.getElementById('file-media-preview');
    if (mediaPreview) {
      mediaPreview.innerHTML = '';
      mediaPreview.classList.add('hidden');
    }
  }

  // ── Kiểm tra email người nhận thời gian thực ──
  const toAddressInput = document.getElementById('toAddress');
  const checkingEl = document.getElementById('toAddressChecking');
  const errorEl = document.getElementById('toAddressError');
  const errorTextEl = document.getElementById('toAddressErrorText');
  const successEl = document.getElementById('toAddressSuccess');
  const successTextEl = document.getElementById('toAddressSuccessText');

  let checkTimer = null;
  let isRecipientValid = null; // null: chưa xác thực, true: hợp lệ, false: không tồn tại

  function setRecipientStatus(state, message) {
    checkingEl.classList.add('hidden');
    errorEl.classList.add('hidden');
    successEl.classList.add('hidden');

    toAddressInput.classList.remove('border-red-500', 'focus:ring-red-500', 'focus:border-red-500',
                                    'border-green-500', 'focus:ring-green-500', 'focus:border-green-500');

    if (state === 'checking') {
      checkingEl.classList.remove('hidden');
    } else if (state === 'error') {
      isRecipientValid = false;
      errorTextEl.textContent = message || 'Địa chỉ email người nhận không tồn tại!';
      errorEl.classList.remove('hidden');
      toAddressInput.classList.add('border-red-500', 'focus:ring-red-500', 'focus:border-red-500');
    } else if (state === 'success') {
      isRecipientValid = true;
      successTextEl.textContent = message || 'Email người nhận hợp lệ';
      successEl.classList.remove('hidden');
      toAddressInput.classList.add('border-green-500', 'focus:ring-green-500', 'focus:border-green-500');
    } else {
      isRecipientValid = null;
    }
  }

  async function checkRecipientAddress(emailVal) {
    if (!emailVal || !emailVal.trim()) {
      setRecipientStatus('idle');
      return;
    }
    const val = emailVal.trim();
    setRecipientStatus('checking');

    try {
      const resp = await fetch('/api/check-recipient?email=' + encodeURIComponent(val));
      if (!resp.ok) {
        setRecipientStatus('idle');
        return;
      }
      const data = await resp.json();
      if (data.exists) {
        setRecipientStatus('success', data.message);
      } else {
        setRecipientStatus('error', data.message);
      }
    } catch (e) {
      console.warn('Check recipient error:', e);
      setRecipientStatus('idle');
    }
  }

  toAddressInput.addEventListener('input', () => {
    isRecipientValid = null;
    clearTimeout(checkTimer);
    checkTimer = setTimeout(() => {
      checkRecipientAddress(toAddressInput.value);
    }, 600);
  });

  toAddressInput.addEventListener('blur', () => {
    clearTimeout(checkTimer);
    if (toAddressInput.value && toAddressInput.value.trim()) {
      checkRecipientAddress(toAddressInput.value);
    }
  });

  // Nếu trang vừa mở đã có sẵn email người nhận
  if (toAddressInput.value && toAddressInput.value.trim()) {
    checkRecipientAddress(toAddressInput.value);
  }

  // ── Submit: kiểm tra người nhận, ghi nội dung Quill, kiểm tra file, hiện loading ──
  const form = document.getElementById("mailForm");
  form.onsubmit = async (e) => {
    e.preventDefault();

    const toVal = toAddressInput.value ? toAddressInput.value.trim() : '';
    if (!toVal) {
      alert('Vui lòng nhập địa chỉ email người nhận!');
      toAddressInput.focus();
      return false;
    }

    const btn = document.getElementById('btn-submit');

    // Nếu chưa xác thực hoặc đang chờ, gọi kiểm tra ngay lập tức
    if (isRecipientValid === null) {
      btn.disabled = true;
      btn.textContent = 'Đang kiểm tra người nhận...';
      try {
        const resp = await fetch('/api/check-recipient?email=' + encodeURIComponent(toVal));
        if (resp.ok) {
          const data = await resp.json();
          if (!data.exists) {
            setRecipientStatus('error', data.message);
            alert(data.message || 'Địa chỉ email người nhận không tồn tại! Vui lòng kiểm tra lại.');
            toAddressInput.focus();
            btn.disabled = false;
            btn.textContent = 'Gửi';
            return false;
          } else {
            setRecipientStatus('success', data.message);
          }
        }
      } catch (err) {
        console.warn('Check recipient failed on submit:', err);
      }
      btn.disabled = false;
      btn.textContent = 'Gửi';
    }

    if (isRecipientValid === false) {
      alert(errorTextEl.textContent || 'Địa chỉ email người nhận không tồn tại! Vui lòng kiểm tra lại.');
      toAddressInput.focus();
      return false;
    }

    const contentInput = document.querySelector("input[name='content']");
    contentInput.value = JSON.stringify(quill.getContents());

    const fileInput = document.getElementById('file');
    if (fileInput.files && fileInput.files.length > 0) {
      const maxSize = 15 * 1024 * 1024; // 15 MB
      if (fileInput.files[0].size > maxSize) {
        alert('File đính kèm vượt quá 15 MB.');
        return false;
      }
    }

    btn.disabled = true;
    btn.textContent = 'Đang gửi...';
    btn.classList.add('opacity-75', 'cursor-not-allowed');
    form.submit();
  };
</script>
</body>
</html>
