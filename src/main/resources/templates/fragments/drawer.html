<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Title</title>
    <script src="/js/lib/tailwind/tailwind.js"></script>
    <script src="/js/lib/tailwind/tailwind.config.js"></script>
</head>
<body>
<div
        class="py-4 overflow-y-auto w-fit min-h-screen min-w-[210px]"
        th:fragment="drawer"
>
    <ul class="space-y-2 px-5 font-medium">
        <li>
            <a
                    class="flex items-center px-5 py-2 text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 rounded-lg group nav-link"
                    href="/template"
            >
                <svg
                        class="w-5 h-5"
                        fill="none"
                        viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg"
                >
                    <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                    <g
                            id="SVGRepo_tracerCarrier"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                    ></g>
                    <g id="SVGRepo_iconCarrier">
                        <path
                                d="M21.2799 6.40005L11.7399 15.94C10.7899 16.89 7.96987 17.33 7.33987 16.7C6.70987 16.07 7.13987 13.25 8.08987 12.3L17.6399 2.75002C17.8754 2.49308 18.1605 2.28654 18.4781 2.14284C18.7956 1.99914 19.139 1.92124 19.4875 1.9139C19.8359 1.90657 20.1823 1.96991 20.5056 2.10012C20.8289 2.23033 21.1225 2.42473 21.3686 2.67153C21.6147 2.91833 21.8083 3.21243 21.9376 3.53609C22.0669 3.85976 22.1294 4.20626 22.1211 4.55471C22.1128 4.90316 22.0339 5.24635 21.8894 5.5635C21.7448 5.88065 21.5375 6.16524 21.2799 6.40005V6.40005Z"
                                stroke="#ffffff"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="1.5"
                        ></path>
                        <path
                                d="M11 4H6C4.93913 4 3.92178 4.42142 3.17163 5.17157C2.42149 5.92172 2 6.93913 2 8V18C2 19.0609 2.42149 20.0783 3.17163 20.8284C3.92178 21.5786 4.93913 22 6 22H17C19.21 22 20 20.2 20 18V13"
                                stroke="#ffffff"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="1.5"
                        ></path>
                    </g>
                </svg>
                <span class="ml-3">Soạn thư</span>
            </a>
        </li>
        <li>
            <a
                    class="flex items-center justify-between px-5 py-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group nav-link"
                    href="/"
            >
              <div class="flex items-center">
                <svg
                        class="w-5 h-5 flex-shrink-0"
                        fill="none"
                        viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg"
                >
                  <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                  <g
                    id="SVGRepo_tracerCarrier"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  ></g>
                  <g id="SVGRepo_iconCarrier">
                    <path
                      d="M14.5 9.50012H9.5M3.02832 10.0001L10.2246 14.8167C10.8661 15.2444 11.1869 15.4582 11.5336 15.5413C11.8399 15.6147 12.1593 15.6147 12.4657 15.5413C12.8124 15.4582 13.1332 15.2444 13.7747 14.8167L20.971 10.0001M10.2981 4.06892L4.49814 7.71139C3.95121 8.05487 3.67775 8.2266 3.4794 8.45876C3.30385 8.66424 3.17176 8.90317 3.09111 9.16112C3 9.45256 3 9.77548 3 10.4213V16.8001C3 17.9202 3 18.4803 3.21799 18.9081C3.40973 19.2844 3.71569 19.5904 4.09202 19.7821C4.51984 20.0001 5.0799 20.0001 6.2 20.0001H17.8C18.9201 20.0001 19.4802 20.0001 19.908 19.7821C20.2843 19.5904 20.5903 19.2844 20.782 18.9081C21 18.4803 21 17.9202 21 16.8001V10.4213C21 9.77548 21 9.45256 20.9089 9.16112C20.8282 8.90317 20.6962 8.66424 20.5206 8.45876C20.3223 8.2266 20.0488 8.05487 19.5019 7.71139L13.7019 4.06891C13.0846 3.68129 12.776 3.48747 12.4449 3.41192C12.152 3.34512 11.848 3.34512 11.5551 3.41192C11.224 3.48747 10.9154 3.68129 10.2981 4.06892Z"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    ></path>
                  </g>
                </svg>
                <span class="ml-3 flex items-center">
                  <span>Hộp thư đến</span>
                  <span id="drawerUnreadCountText"
                        th:text="${unreadInboxCount != null and unreadInboxCount > 0} ? '(' + ${unreadInboxCount} + ')' : ''"
                        th:class="${unreadInboxCount != null and unreadInboxCount > 0} ? 'text-blue-600 font-bold ml-1' : 'hidden text-blue-600 font-bold ml-1'"></span>
                </span>
              </div>
            </a>
        </li>
        <li>
            <a
                    class="flex items-center px-5 py-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group nav-link"
                    href="/sent"
            >
              <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
              <g
                id="SVGRepo_tracerCarrier"
                stroke-linecap="round"
                stroke-linejoin="round"
              ></g>
              <g id="SVGRepo_iconCarrier">
                <path
                  d="M11.5003 12H5.41872M5.24634 12.7972L4.24158 15.7986C3.69128 17.4424 3.41613 18.2643 3.61359 18.7704C3.78506 19.21 4.15335 19.5432 4.6078 19.6701C5.13111 19.8161 5.92151 19.4604 7.50231 18.7491L17.6367 14.1886C19.1797 13.4942 19.9512 13.1471 20.1896 12.6648C20.3968 12.2458 20.3968 11.7541 20.1896 11.3351C19.9512 10.8529 19.1797 10.5057 17.6367 9.81135L7.48483 5.24303C5.90879 4.53382 5.12078 4.17921 4.59799 4.32468C4.14397 4.45101 3.77572 4.78336 3.60365 5.22209C3.40551 5.72728 3.67772 6.54741 4.22215 8.18767L5.24829 11.2793C5.34179 11.561 5.38855 11.7019 5.407 11.8459C5.42338 11.9738 5.42321 12.1032 5.40651 12.231C5.38768 12.375 5.34057 12.5157 5.24634 12.7972Z"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </g>
            </svg>
            <span class="ml-3">Thư đã gửi</span>
          </a>
        </li>
        <li>
          <a
            href="/spam"
            class="flex items-center px-5 py-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group nav-link"
          >
            <svg
              stroke="currentColor"
              fill="currentColor"
              stroke-width="0"
              viewBox="0 0 24 24"
              height="20px"
              width="20px"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M15.935 2.50098L21.5 8.06595V15.936L15.935 21.501H8.06497L2.5 15.936V8.06595L8.06497 2.50098H15.935ZM15.1066 4.50098H8.8934L4.5 8.89437V15.1076L8.8934 19.501H15.1066L19.5 15.1076V8.89437L15.1066 4.50098ZM7.99926 11.0002H15.9993V13.0002H7.99926V11.0002Z"
              ></path>
            </svg>
            <span class="ml-3">Spam</span>
          </a>
        </li>
        <li>
          <a
            href="/trash"
            class="flex items-center px-5 py-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group nav-link"
          >
            <svg class="w-5 h-5 text-gray-500 group-hover:text-gray-900 dark:text-gray-400 dark:group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
            <span class="ml-3">Thùng rác</span>
          </a>
        </li>
      </ul>
      <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Get the current URL
            var currentURL = window.location.pathname;

            // Get all navigation links
            var navigationLinks = document.querySelectorAll(".nav-link");

            // Iterate through navigation links and add the 'active' class to the matching one
            navigationLinks.forEach(function (link) {
                if (
                    link.getAttribute("href") === currentURL &&
                    currentURL !== "/send" &&
                    currentURL !== "/template"
                ) {
                    link.classList.add("text-primary-600");
                }
            });

            // --- Tự động tải số lượng thư chưa đọc trong Hộp thư đến (Real-time Polling) ---
            initRealtimeUnreadTracker();
        });

        if (document.readyState !== 'loading') {
            initRealtimeUnreadTracker();
        }

        function initRealtimeUnreadTracker() {
            if (window._unreadTrackerStarted) return;
            window._unreadTrackerStarted = true;

            var initialText = document.getElementById('drawerUnreadCountText');
            var previousCount = (initialText && !initialText.classList.contains('hidden'))
                ? (parseInt(initialText.textContent.replace(/\D/g, ''), 10) || 0)
                : 0;
            var previousTotal = -1;

            function updateUI(unreadCount, totalCount) {
                var num = parseInt(unreadCount, 10) || 0;
                var total = parseInt(totalCount, 10) || 0;

                // 1. Cập nhật nhãn bên cạnh chữ "Hộp thư đến" trong menu Drawer: "Hộp thư đến (X)"
                var drawerText = document.getElementById('drawerUnreadCountText');
                if (drawerText) {
                    if (num > 0) {
                        drawerText.textContent = '(' + num + ')';
                        drawerText.classList.remove('hidden');
                    } else {
                        drawerText.textContent = '';
                        drawerText.classList.add('hidden');
                    }
                }

                // 2. Cập nhật tiêu đề trên trang Home nếu đang ở Hộp thư đến
                var homeText = document.getElementById('homeUnreadInboxCount');
                if (homeText) {
                    if (num > 0) {
                        homeText.textContent = '(' + num + ')';
                        homeText.classList.remove('hidden');
                    } else {
                        homeText.textContent = '';
                        homeText.classList.add('hidden');
                    }
                }

                // 3. Cập nhật Tiêu đề tab trình duyệt
                try {
                    var baseTitle = document.title.replace(/^\(\d+\)\s*/, '');
                    if (num > 0) {
                        document.title = '(' + num + ') ' + baseTitle;
                    } else {
                        document.title = baseTitle;
                    }
                } catch (e) {}

                // 4. Nếu có thư mới đến (số chưa đọc tăng HOẶC tổng số thư tăng):
                var hasNewMail = (previousCount !== -1 && num > previousCount) ||
                                 (previousTotal !== -1 && total > previousTotal);

                if (hasNewMail) {
                    var diff = Math.max(num - previousCount, total - previousTotal, 1);
                    previousCount = num;
                    previousTotal = total;
                    var currentPath = window.location.pathname;

                    // Nếu đang ở trang Hộp thư đến (/ hoặc /home):
                    // -> TỰ ĐỘNG CẬP NHẬT LUÔN (tải lại danh sách thư) mà không cần người dùng phải xác nhận!
                    var isInbox = (currentPath === '/' || currentPath === '/home' || currentPath === '');
                    if (isInbox) {
                        var hasSelected = document.querySelectorAll('input.mail-checkbox:checked, input#selectAll:checked').length > 0;
                        if (!hasSelected) {
                            window.location.reload();
                            return;
                        }
                    }

                    // Nếu đang ở trang khác (hoặc đang tích chọn thư): hiển thị toast thông báo
                    showNewMailNotification(diff);
                    return;
                }
                previousCount = num;
                previousTotal = total;
            }

            function showNewMailNotification(newMailsCount) {
                var toast = document.getElementById('realtimeNewMailToast');
                if (!toast) {
                    toast = document.createElement('div');
                    toast.id = 'realtimeNewMailToast';
                    toast.className = 'fixed bottom-5 right-5 z-50 flex items-center bg-blue-600 hover:bg-blue-700 text-white px-4 py-3 rounded-xl shadow-2xl cursor-pointer transition transform hover:scale-105 duration-200 border border-blue-400';
                    toast.onclick = function() { window.location.href = '/'; };
                    document.body.appendChild(toast);
                }
                var countText = newMailsCount > 1 ? (newMailsCount + ' thư mới') : '1 thư mới';
                toast.innerHTML = 
                    '<div class="flex items-center space-x-3">' +
                        '<div class="p-2 bg-blue-500 rounded-lg">' +
                            '<svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">' +
                                '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>' +
                            '</svg>' +
                        '</div>' +
                        '<div>' +
                            '<p class="font-bold text-sm">Có ' + countText + ' trong Hộp thư đến!</p>' +
                            '<p class="text-xs text-blue-100">Nhấn vào đây để xem ngay</p>' +
                        '</div>' +
                    '</div>';
                toast.classList.remove('hidden');

                setTimeout(function() {
                    if (toast && !toast.matches(':hover')) {
                        toast.classList.add('hidden');
                    }
                }, 8000);
            }

            function checkUnreadCount() {
                fetch('/api/unread-count')
                    .then(function(res) {
                        if (res.ok) return res.json();
                        return null;
                    })
                    .then(function(data) {
                        if (data && typeof data.unreadCount !== 'undefined') {
                            updateUI(data.unreadCount, data.totalCount);
                        }
                    })
                    .catch(function(err) {
                        // Bỏ qua lỗi kết nối tạm thời
                    });
            }

            // Kiểm tra ngay lập tức lần đầu
            checkUnreadCount();

            // Tự động kiểm tra định kỳ mỗi 3 giây
            setInterval(checkUnreadCount, 3000);

            // Kiểm tra ngay lập tức khi người dùng chuyển lại vào tab trình duyệt
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    checkUnreadCount();
                }
            });
            window.addEventListener('focus', checkUnreadCount);
        }
    </script>
</div>
</body>
</html>
