<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Title</title>
      <script src="/js/lib/tailwind/tailwind.js"></script>
      <script src="/js/lib/tailwind/tailwind.config.js"></script>
  </head>
  <body>
    <nav class="bg-white border-gray-200 dark:bg-gray-900" th:fragment="header">
      <div class="flex flex-wrap items-center mx-auto p-4">
        <a href="/" class="flex items-center">
          <img src="/image/logo.png" class="h-9 w-9 mr-3 object-contain rounded-full shadow-sm" alt="Mail Logo" />
          <span
            class="self-center text-2xl font-bold whitespace-nowrap text-blue-700 dark:text-white"
            >Mail Application</span
          >
        </a>
        <div class="flex flex-1 justify-center">
          <div class="relative w-1/2">
            <div
              class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none"
            >
              <svg
                class="w-4 h-4 text-gray-500 dark:text-gray-400"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 20 20"
              >
                <path
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"
                />
              </svg>
              <span class="sr-only">Search icon</span>
            </div>
            <input
              type="text"
              id="search-navbar"
              class="block w-full p-2 pl-10 text-sm text-gray-900 border border-gray-300 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
              placeholder="Tìm kiếm theo tiêu đề, người gửi, nội dung..."
            />
            <p id="search-count" class="absolute right-3 top-2.5 text-xs text-gray-400 hidden"></p>
          </div>
        </div>
        <div>
          <button
            type="button"
            class="flex mr-3 text-sm bg-gray-800 rounded-full md:mr-0 focus:ring-4 focus:ring-gray-300 dark:focus:ring-gray-600"
            id="user-menu-button"
            aria-expanded="false"
            data-dropdown-toggle="user-dropdown"
            data-dropdown-placement="bottom"
          >
            <img
              class="w-8 h-8 rounded-full"
              src="/image/user.jpeg"
              alt="user photo"
            />
          </button>
          <!-- Dropdown menu -->
          <div
            class="fixed right-5 z-50 hidden my-4 text-base list-none bg-white divide-y divide-gray-100 rounded-lg shadow dark:bg-gray-700 dark:divide-gray-600"
            id="user-dropdown"
          >
            <div class="px-4 py-3">
              <span class="block text-sm font-semibold text-gray-900 dark:text-white"
                >Tài khoản hiện tại</span
              >
              <span
                class="block text-sm text-gray-500 truncate dark:text-gray-400"
                th:text="${currentUser != null ? currentUser : 'user@domain.com'}"
                >user@domain.com</span
              >
            </div>
            <ul class="py-2" aria-labelledby="user-menu-button">
              <li>
                <a
                  href="/logout"
                  class="block px-4 py-2 text-sm text-red-600 hover:bg-gray-100 dark:hover:bg-gray-600 dark:text-red-400 dark:hover:text-white"
                  >Đăng xuất</a
                >
              </li>
            </ul>
          </div>
        </div>
      </div>
      <script>
        // ── User dropdown toggle ──
        const button = document.querySelector("#user-menu-button");
        const menu = document.querySelector("#user-dropdown");
        if (button && menu) {
          button.onclick = (e) => {
            e.stopPropagation();
            menu.classList.toggle("hidden");
          };
          document.addEventListener("click", (e) => {
            if (!button.contains(e.target) && !menu.contains(e.target)) {
              menu.classList.add("hidden");
            }
          });
        }

        // ── Hàm loại bỏ dấu tiếng Việt chuẩn quốc tế ──
        function removeVietnameseTones(str) {
          if (!str) return "";
          return str
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/đ/g, "d")
            .replace(/Đ/g, "d")
            .toLowerCase()
            .trim();
        }

        // ── Tìm kiếm real-time trong bảng email (có dấu & không dấu cho kết quả như nhau) ──
        document.addEventListener("DOMContentLoaded", function () {
          const searchInput = document.getElementById("search-navbar");
          const countEl     = document.getElementById("search-count");
          if (!searchInput) return;

          function executeSearch() {
            const rawVal = searchInput.value || "";
            const keyword = removeVietnameseTones(rawVal);
            const terms = keyword.split(/\s+/).filter(t => t.length > 0);

            const rows = document.querySelectorAll("tbody tr.mail-row");
            const emptyNoticeRow = document.querySelector("tbody tr:not(.mail-row):not(#no-search-result)");
            const pagContainer = document.getElementById("pagination-container");
            const tbody = document.querySelector("tbody");
            let visibleCount = 0;

            if (keyword === "") {
              // Khôi phục trạng thái phân trang ban đầu khi xóa trắng ô tìm kiếm
              if (pagContainer) pagContainer.style.display = "";
              if (emptyNoticeRow) emptyNoticeRow.style.display = "";
              if (typeof renderPage === "function") {
                renderPage();
              } else {
                rows.forEach(r => r.style.display = "");
              }
              if (countEl) countEl.classList.add("hidden");
              const noResult = document.getElementById("no-search-result");
              if (noResult) noResult.style.display = "none";
              return;
            }

            // Đang tìm kiếm: tạm ẩn phân trang để hiển thị tất cả các kết quả khớp
            if (pagContainer) pagContainer.style.display = "none";
            if (emptyNoticeRow) emptyNoticeRow.style.display = "none";

            rows.forEach(function (row) {
              const text = removeVietnameseTones(row.innerText);
              const isMatch = text.includes(keyword) || (terms.length > 0 && terms.every(t => text.includes(t)));
              if (isMatch) {
                row.style.display = "";
                visibleCount++;
              } else {
                row.style.display = "none";
              }
            });

            // Hiển thị số lượng kết quả
            if (countEl) {
              countEl.textContent = visibleCount + " kết quả";
              countEl.classList.remove("hidden");
            }

            // Thông báo nếu không tìm thấy kết quả nào
            let noResult = document.getElementById("no-search-result");
            if (!noResult && tbody) {
              noResult = document.createElement("tr");
              noResult.id = "no-search-result";
              noResult.innerHTML = '<td colspan="5" class="px-6 py-8 text-center text-gray-400">🔍 Không tìm thấy thư nào khớp với từ khóa tìm kiếm.</td>';
              tbody.appendChild(noResult);
            }
            if (noResult) {
              noResult.style.display = (visibleCount === 0) ? "" : "none";
            }
          }

          searchInput.addEventListener("input", executeSearch);
          searchInput.addEventListener("keyup", executeSearch);
        });
      </script>
    </nav>
  </body>
</html>
