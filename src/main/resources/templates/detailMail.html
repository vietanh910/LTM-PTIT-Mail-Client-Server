<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chi tiết thư</title>
    <script src="/js/lib/tailwind/tailwind.js"></script>
    <script src="/js/lib/tailwind/tailwind.config.js"></script>
    <link href="/js/lib/quill/quill.snow.css" rel="stylesheet" />
  </head>
  <body>
    <div th:replace="~{fragments/header :: header}">...</div>
    <div class="flex">
      <div th:replace="~{fragments/drawer :: drawer}">...</div>
      <div class="min-h-screen rounded-lg flex flex-col flex-1 bg-gray-50 p-10">
        <div>
          <!-- Thanh công cụ phía trên: Nút Quay lại và Trả lời thư -->
          <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-200">
            <div class="flex gap-3">
              <a
                href="javascript:history.back()"
                class="inline-flex items-center text-gray-700 bg-white border border-gray-300 hover:bg-gray-100 focus:ring-4 focus:ring-gray-200 font-medium rounded-lg text-sm px-4 py-2 shadow-sm transition"
              >
                <svg class="w-4 h-4 mr-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Quay lại
              </a>
              <button
                type="button"
                id="btn-reply"
                class="inline-flex items-center text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2 shadow-sm transition"
              >
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path>
                </svg>
                Trả lời thư
              </button>
              <button
                type="button"
                id="btn-restore-detail"
                class="hidden inline-flex items-center text-white bg-green-600 hover:bg-green-700 focus:ring-4 focus:ring-green-300 font-medium rounded-lg text-sm px-4 py-2 shadow-sm transition"
              >
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                Khôi phục thư
              </button>
              <button
                type="button"
                id="btn-perm-delete-detail"
                class="hidden inline-flex items-center text-white bg-red-600 hover:bg-red-700 focus:ring-4 focus:ring-red-300 font-medium rounded-lg text-sm px-4 py-2 shadow-sm transition"
              >
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
                Xóa vĩnh viễn
              </button>
            </div>
          </div>

          <div class="mb-6 relative">
            <div
              class="block w-fit top-[-12px] left-[20px] absolute bg-gray-50 text-sm font-medium text-gray-900 dark:text-white"
              id="author"
            >
              Người nhận
            </div>
            <div
              class="border-none border-gray-300 text-gray-900 text-sm bg-white rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
              id="address"
            ></div>
          </div>
          <div class="mb-6 relative">
            <span
              class="block w-fit top-[-12px] left-[20px] absolute bg-gray-50 text-sm font-medium text-gray-900 dark:text-white"
              >Tiêu đề</span
            >
            <span
              class="border-none border-gray-300 text-gray-900 text-sm rounded-lg bg-white focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500 font-semibold text-base"
              id="subject"
            ></span>
          </div>
          <div class="mb-6 relative">
            <span
              class="block w-fit top-[-12px] left-[20px] absolute bg-gray-50 text-sm font-medium text-gray-900 dark:text-white z-10"
              >Nội dung</span
            >
            <div
              class="bg-white rounded-lg cursor-text min-h-[16rem] p-4 border border-gray-200 overflow-y-auto whitespace-pre-wrap"
              id="content"
            ></div>
          </div>

          <!-- File đính kèm -->
          <div id="attachment-section" class="mb-6 hidden">
            <h3 class="text-sm font-semibold text-gray-700 mb-2 flex items-center gap-1.5">
              <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
              </svg>
              Tệp đính kèm
            </h3>
            <div id="attachment-list" class="space-y-3">
              <!-- Rendered via JS -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/js/lib/quill/quill.js"></script>
    <script th:inline="javascript">
      const emailRaw = localStorage.getItem("email");
      const email = emailRaw ? JSON.parse(emailRaw) : null;
      const authorData = localStorage.getItem("author");
      let subject = document.getElementById("subject");
      let author = document.getElementById("author");
      let address = document.getElementById("address");
      let content = document.getElementById("content");

      if (email) {
        subject.innerText = email.subject || '(Không có tiêu đề)';

        if (authorData === "me") {
          author.innerText = "Người nhận";
          address.innerText = email.toAddress || '';
          document.getElementById("btn-reply").style.display = "none";
        } else {
          author.innerText = "Người gửi";
          address.innerText = email.fromAddress || '';
        }

        try {
          const contentData = JSON.parse(email.content);
          const quill = new Quill("#content", {
            theme: "snow",
            modules: { toolbar: null },
            readOnly: true
          });
          quill.setContents(contentData);
          quill.enable(false);
        } catch (e) {
          content.innerText = email.content || '(Thư không có nội dung)';
        }

        if (email.deleted) {
          const btnReply = document.getElementById("btn-reply");
          if (btnReply) btnReply.classList.add("hidden");

          const btnRestore = document.getElementById("btn-restore-detail");
          if (btnRestore) {
            btnRestore.classList.remove("hidden");
            btnRestore.onclick = function() {
              fetch('/mail/restore', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify([email.id])
              })
              .then(res => res.text())
              .then(msg => {
                alert(msg);
                window.location.href = '/trash';
              })
              .catch(err => alert("Có lỗi xảy ra: " + err));
            };
          }

          const btnPermDel = document.getElementById("btn-perm-delete-detail");
          if (btnPermDel) {
            btnPermDel.classList.remove("hidden");
            btnPermDel.onclick = function() {
              if (!confirm("Bạn có chắc chắn muốn xóa vĩnh viễn thư này?\nLưu ý: Hành động này không thể hoàn tác!")) return;
              fetch('/mail/permanent-delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify([email.id])
              })
              .then(res => res.text())
              .then(msg => {
                alert(msg);
                window.location.href = '/trash';
              })
              .catch(err => alert("Có lỗi xảy ra: " + err));
            };
          }
        } else {
          document.getElementById("btn-reply").onclick = function() {
            const replySubject = email.subject && email.subject.startsWith("Re:") ? email.subject : "Re: " + (email.subject || '');
            window.location.href = `/send?replyTo=${encodeURIComponent(email.fromAddress)}&subject=${encodeURIComponent(replySubject)}`;
          };
        }

        // Hiển thị file đính kèm nếu có
        if (email.hasAttachment && email.attachmentName) {
          const section = document.getElementById('attachment-section');
          const list = document.getElementById('attachment-list');
          list.innerHTML = '';

          const fileNames = email.attachmentName.split(';').map(s => s.trim()).filter(Boolean);
          fileNames.forEach(rawFileName => {
            const displayName = rawFileName.replace(/^\d+_/, '');
            const isImage = /\.(png|jpe?g|gif|webp|bmp)$/i.test(displayName);
            const isPdf = /\.pdf$/i.test(displayName);

            const card = document.createElement('div');
            card.className = "p-4 bg-white border border-gray-200 rounded-lg shadow-sm";

            let previewHtml = '';
            if (isImage) {
              previewHtml = `
                <div class="mt-3 overflow-hidden rounded border border-gray-200 bg-gray-50 p-2 max-w-lg">
                  <a href="/attachment/view?filename=${encodeURIComponent(rawFileName)}" target="_blank" title="Bấm vào để mở ảnh kích thước đầy đủ">
                    <img src="/attachment/view?filename=${encodeURIComponent(rawFileName)}" alt="${displayName}" class="max-h-80 w-auto rounded object-contain cursor-zoom-in hover:opacity-95 transition" />
                  </a>
                </div>
              `;
            }

            card.innerHTML = `
              <div class="flex items-center justify-between gap-3 flex-wrap">
                <div class="flex items-center gap-3 min-w-0">
                  <div class="p-2.5 bg-blue-50 text-blue-600 rounded-lg flex-shrink-0">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path>
                    </svg>
                  </div>
                  <div class="min-w-0">
                    <p class="text-sm font-medium text-gray-900 truncate" title="${displayName}">${displayName}</p>
                    <span class="text-xs text-gray-500">${isImage ? 'Hình ảnh' : (isPdf ? 'Tài liệu PDF' : 'Tệp đính kèm')}</span>
                  </div>
                </div>
                <div class="flex items-center gap-2 flex-shrink-0">
                  <a href="/attachment/view?filename=${encodeURIComponent(rawFileName)}" target="_blank"
                     class="inline-flex items-center px-3 py-1.5 text-xs font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition">
                    <svg class="w-3.5 h-3.5 mr-1 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                    Xem file
                  </a>
                  <a href="/attachment/download?filename=${encodeURIComponent(rawFileName)}"
                     class="inline-flex items-center px-3 py-1.5 text-xs font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition shadow-sm">
                    <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                    </svg>
                    Tải xuống
                  </a>
                </div>
              </div>
              ${previewHtml}
            `;
            list.appendChild(card);
          });
          section.classList.remove('hidden');
        }
      } else {
        subject.innerText = "Không tìm thấy dữ liệu thư";
        content.innerText = "Vui lòng chọn thư từ danh sách Hộp thư đến hoặc Thư đã gửi.";
      }
    </script>
  </body>
</html>
