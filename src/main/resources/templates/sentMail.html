<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Thư đã gửi</title>
    <link rel="icon" type="image/png" href="/image/logo.png" />
    <script src="/js/lib/tailwind/tailwind.js"></script>
    <script src="/js/lib/tailwind/tailwind.config.js"></script>
    <link href="/js/lib/quill/quill.bubble.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans antialiased">
<div th:replace="~{fragments/header :: header}">...</div>
<div class="flex">
    <div th:replace="~{fragments/drawer :: drawer}">...</div>
    <div class="min-h-screen rounded-lg flex flex-1 bg-gray-50 flex-col p-4">
        
        <!-- Toolbar hành động hàng loạt -->
        <div class="flex items-center justify-between bg-white px-5 py-3 rounded-t-lg border-b border-gray-200 shadow-sm">
            <div class="flex items-center space-x-3">
                <input id="selectAll" type="checkbox" onchange="toggleSelectAll(this)"
                       class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 cursor-pointer">
                <label for="selectAll" class="text-sm font-medium text-gray-700 cursor-pointer">Chọn tất cả</label>
                <span id="selectedCountBadge" class="hidden text-xs bg-blue-100 text-blue-800 font-semibold px-2.5 py-0.5 rounded-full">
                    Đã chọn <span id="selectedCount">0</span> thư
                </span>
            </div>
            
            <div class="flex items-center space-x-2">
                <!-- Nút Xóa thư -->
                <button type="button" onclick="bulkDelete()" id="btnDelete"
                        class="inline-flex items-center px-3 py-1.5 text-xs font-medium text-red-700 bg-red-50 border border-red-200 rounded-lg hover:bg-red-100 focus:ring-2 focus:ring-red-300 transition">
                    <svg class="w-4 h-4 mr-1 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                    </svg>
                    Xóa thư đã chọn
                </button>
            </div>
        </div>

        <div class="flex-1 bg-white rounded-b-lg shadow-sm overflow-hidden">
            <table class="w-full text-sm text-left text-gray-500">
                <thead class="text-xs text-gray-700 uppercase bg-gray-100/70 border-b border-gray-200">
                <tr>
                    <th class="px-4 py-3 w-[4%]" scope="col"></th>
                    <th class="px-4 py-3 w-[18%]" scope="col">Người nhận</th>
                    <th class="px-6 py-3 w-[25%]" scope="col">Tiêu đề</th>
                    <th class="px-6 py-3 w-[40%]" scope="col">Nội dung</th>
                    <th class="px-4 py-3 w-[13%]" scope="col">Thời gian gửi</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                <tr th:each="email : ${emails}"
                    class="mail-row bg-white border-b hover:bg-gray-50 transition duration-150 cursor-pointer"
                    th:attr="onClick=|handleRowClick(event, '${email.id}')|">
                    
                    <!-- Checkbox chọn từng thư -->
                    <td class="px-4 py-4 text-center" onclick="event.stopPropagation();">
                        <input type="checkbox" th:value="${email.id}" onchange="updateSelection()"
                                class="mail-checkbox w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 cursor-pointer">
                    </td>
                    
                    <td class="px-4 py-4 font-medium text-gray-900 whitespace-nowrap">
                        <div th:text="${email.toAddress}"></div>
                    </td>
                    
                    <td class="px-6 py-4">
                        <div class="flex items-center space-x-1.5">
                            <span th:if="${email.hasAttachment}" title="Có tệp đính kèm" class="text-blue-600 flex-shrink-0">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path>
                                </svg>
                            </span>
                            <a th:id="${email.id}"
                               class="truncate max-w-[280px] block text-gray-900 font-medium"
                               th:text="${email.subject}">
                            </a>
                            <a th:if="${email.hasAttachment and email.attachmentName != null}"
                               th:href="'/attachment/view?filename=' + ${email.attachmentName}"
                               target="_blank"
                               onclick="event.stopPropagation();"
                               class="inline-flex items-center px-1.5 py-0.5 text-[11px] font-medium bg-blue-50 text-blue-700 hover:bg-blue-100 border border-blue-200 rounded flex-shrink-0 transition ml-1"
                               title="Bấm để xem trực tiếp tệp đính kèm">
                                📎 Xem tệp
                            </a>
                        </div>
                    </td>
                    
                    <td class="px-6 py-4 truncate max-w-[450px]">
                        <div class="truncate text-gray-500 font-normal"
                             th:id="'content-' + ${email.id}"
                             th:text="${email.content}">
                        </div>
                    </td>
                    
                    <td class="px-4 py-4 text-gray-500 text-xs whitespace-nowrap" th:text="${email.date}">
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(emails)}">
                    <td colspan="5" class="px-6 py-12 text-center text-gray-400">
                        <svg class="w-12 h-12 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                        </svg>
                        Không có thư nào trong Thư đã gửi
                    </td>
                </tr>
                </tbody>
            </table>

            <!-- Thanh điều hướng phân trang -->
            <div id="pagination-container" class="flex flex-col sm:flex-row items-center justify-between px-6 py-4 bg-gray-50 border-t border-gray-200 text-sm text-gray-600 gap-3">
                <div class="flex items-center gap-2">
                    <span class="text-xs sm:text-sm font-medium text-gray-700">Hiển thị:</span>
                    <select id="pageSizeSelect" onchange="changePageSize(this.value)" class="bg-white border border-gray-300 text-gray-700 text-xs sm:text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-1.5 shadow-sm">
                        <option value="10">10 thư / trang</option>
                        <option value="20">20 thư / trang</option>
                        <option value="50">50 thư / trang</option>
                        <option value="100">100 thư / trang</option>
                    </select>
                    <span id="pageSummary" class="text-xs text-gray-500 ml-1"></span>
                </div>
                <div class="flex items-center space-x-1" id="paginationControls">
                    <!-- Nút phân trang tạo tự động bằng JS -->
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/lib/quill/quill.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    const emails = /*[[${emails}]]*/ [];
    /*]]>*/
    for (let i = 0; i < emails.length; i++) {
        const email = emails[i];
        if (!email) continue;
        const container = document.querySelector(`#content-${email.id}`);
        if (!container) continue;

        try {
            const parsed = JSON.parse(email.content);
            const quill = new Quill(`#content-${email.id}`, {
                theme: 'bubble',
                readOnly: true,
            });
            quill.setContents(parsed);
            quill.root.innerHTML = `<p class="truncate text-gray-500">${quill.getText()}</p>`;
        } catch (e) {
            container.innerText = email.content || '';
        }
    }

    function handleRowClick(event, id) {
        if (event.target.tagName.toLowerCase() === 'input') return;
        getDetailMail(id);
    }

    function getDetailMail(id) {
        const email = emails.find((email) => email.id == id);
        if (email) {
            localStorage.setItem("email", JSON.stringify(email));
            localStorage.setItem("author", "me");
            window.location.href = "/detail/" + id;
        }
    }

    // ==================== PHÂN TRANG (PAGINATION) ====================
    let currentPage = 1;
    let pageSize = parseInt(localStorage.getItem('mailPageSize')) || 10;

    const pageSizeSelect = document.getElementById('pageSizeSelect');
    if (pageSizeSelect) {
        pageSizeSelect.value = pageSize.toString();
    }

    function changePageSize(newSize) {
        pageSize = parseInt(newSize);
        localStorage.setItem('mailPageSize', pageSize);
        currentPage = 1;
        renderPage();
    }

    function goToPage(page) {
        const rows = document.querySelectorAll('.mail-row');
        const totalPages = Math.ceil(rows.length / pageSize) || 1;
        if (page < 1) page = 1;
        if (page > totalPages) page = totalPages;
        currentPage = page;
        renderPage();
    }

    function renderPage() {
        const rows = document.querySelectorAll('.mail-row');
        const totalItems = rows.length;
        const totalPages = Math.ceil(totalItems / pageSize) || 1;

        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        const startIndex = (currentPage - 1) * pageSize;
        const endIndex = Math.min(startIndex + pageSize, totalItems);

        rows.forEach((row, index) => {
            if (index >= startIndex && index < endIndex) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }
        });

        // Cập nhật tóm tắt số lượng
        const summaryEl = document.getElementById('pageSummary');
        if (summaryEl) {
            if (totalItems === 0) {
                summaryEl.innerText = '(0 thư)';
            } else {
                summaryEl.innerText = `(${startIndex + 1} - ${endIndex} / ${totalItems} thư)`;
            }
        }

        renderPaginationControls(totalPages);
        updateSelection();
    }

    function renderPaginationControls(totalPages) {
        const container = document.getElementById('paginationControls');
        if (!container) return;

        if (totalPages <= 1) {
            container.innerHTML = '';
            return;
        }

        let html = '';
        const isFirst = (currentPage === 1);
        const isLast = (currentPage === totalPages);

        html += `
            <button type="button" onclick="goToPage(1)" ${isFirst ? 'disabled' : ''} title="Trang đầu"
                    class="px-2.5 py-1 text-xs rounded border border-gray-300 bg-white hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed">
                &laquo;
            </button>
            <button type="button" onclick="goToPage(${currentPage - 1})" ${isFirst ? 'disabled' : ''} title="Trang trước"
                    class="px-2.5 py-1 text-xs rounded border border-gray-300 bg-white hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed">
                &lsaquo;
            </button>
        `;

        let startPage = Math.max(1, currentPage - 2);
        let endPage = Math.min(totalPages, currentPage + 2);

        if (startPage > 1) {
            html += `<span class="px-1.5 py-1 text-xs text-gray-400">...</span>`;
        }

        for (let p = startPage; p <= endPage; p++) {
            if (p === currentPage) {
                html += `
                    <button type="button" class="px-3 py-1 text-xs font-bold rounded bg-blue-600 text-white shadow-sm">
                        ${p}
                    </button>
                `;
            } else {
                html += `
                    <button type="button" onclick="goToPage(${p})"
                            class="px-3 py-1 text-xs rounded border border-gray-300 bg-white hover:bg-gray-100 text-gray-700">
                        ${p}
                    </button>
                `;
            }
        }

        if (endPage < totalPages) {
            html += `<span class="px-1.5 py-1 text-xs text-gray-400">...</span>`;
        }

        html += `
            <button type="button" onclick="goToPage(${currentPage + 1})" ${isLast ? 'disabled' : ''} title="Trang sau"
                    class="px-2.5 py-1 text-xs rounded border border-gray-300 bg-white hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed">
                &rsaquo;
            </button>
            <button type="button" onclick="goToPage(${totalPages})" ${isLast ? 'disabled' : ''} title="Trang cuối"
                    class="px-2.5 py-1 text-xs rounded border border-gray-300 bg-white hover:bg-gray-100 disabled:opacity-40 disabled:cursor-not-allowed">
                &raquo;
            </button>
        `;

        container.innerHTML = html;
    }

    // Khởi tạo phân trang ngay khi tải trang
    renderPage();

    function toggleSelectAll(master) {
        const visibleCheckboxes = document.querySelectorAll('.mail-row:not([style*="display: none"]) .mail-checkbox');
        visibleCheckboxes.forEach(cb => cb.checked = master.checked);
        updateSelection();
    }

    function updateSelection() {
        const allCheckboxes = document.querySelectorAll('.mail-checkbox');
        const checked = Array.from(allCheckboxes).filter(cb => cb.checked);
        const count = checked.length;
        
        const badge = document.getElementById('selectedCountBadge');
        const countEl = document.getElementById('selectedCount');
        const selectAll = document.getElementById('selectAll');
        
        if (countEl) countEl.innerText = count;
        if (badge) {
            if (count > 0) badge.classList.remove('hidden');
            else badge.classList.add('hidden');
        }
        
        const visibleCheckboxes = document.querySelectorAll('.mail-row:not([style*="display: none"]) .mail-checkbox');
        if (selectAll && visibleCheckboxes.length > 0) {
            const visibleChecked = Array.from(visibleCheckboxes).filter(cb => cb.checked);
            selectAll.checked = (visibleChecked.length === visibleCheckboxes.length);
        } else if (selectAll) {
            selectAll.checked = false;
        }
    }

    function getSelectedIds() {
        const checkboxes = document.querySelectorAll('.mail-checkbox:checked');
        return Array.from(checkboxes).map(cb => cb.value);
    }

    function bulkDelete() {
        const ids = getSelectedIds();
        if (ids.length === 0) {
            alert("Vui lòng chọn ít nhất một thư để xóa.");
            return;
        }

        if (!confirm(`Bạn có chắc chắn muốn chuyển ${ids.length} thư đã chọn vào Thùng rác?`)) {
            return;
        }

        fetch('/mail/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(ids)
        })
        .then(res => res.text())
        .then(msg => {
            window.location.reload();
        })
        .catch(err => alert("Có lỗi xảy ra: " + err));
    }
</script>

</body>
</html>
