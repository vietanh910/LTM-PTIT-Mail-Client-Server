<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Đăng ký tài khoản - Mail Application</title>
    <link rel="icon" type="image/png" href="/image/logo.png" />
    <script src="/js/lib/tailwind/tailwind.js"></script>
    <script src="/js/lib/tailwind/tailwind.config.js"></script>
  </head>
  <body>
    <div class="bg-gray-50 min-h-screen py-10">
      <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto min-h-screen lg:py-0">
        <a href="#" class="flex items-center mb-6 text-2xl font-bold text-blue-700">
          <img class="w-10 h-10 mr-2.5 object-contain rounded-full shadow-sm" src="/image/logo.png" alt="logo" />
          Mail Application
        </a>

        <div class="w-full bg-white rounded-xl shadow-md md:mt-0 sm:max-w-lg xl:p-0">
          <div class="p-6 space-y-4 md:space-y-5 sm:p-8">
            <h1 class="text-xl font-bold leading-tight tracking-tight text-gray-900 md:text-2xl">
              Tạo tài khoản mới
            </h1>

            <!-- Thông báo lỗi từ server -->
            <div th:if="${param.error}"
                 class="flex items-start gap-2 p-4 text-sm text-red-800 bg-red-50 border border-red-200 rounded-lg">
              <svg class="w-4 h-4 mt-0.5 flex-shrink-0 text-red-600" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
              </svg>
              <span th:text="${param.error}">Có lỗi xảy ra khi đăng ký</span>
            </div>

            <form id="registerForm" class="space-y-4 md:space-y-5" action="/register" method="post"
                  onsubmit="return validateForm()">

              <!-- Tên đăng nhập -->
              <div>
                <label for="username" class="block mb-1.5 text-sm font-medium text-gray-900">
                  Tên đăng nhập <span class="text-red-500">*</span>
                </label>
                <input type="text" name="taikhoan" id="username"
                       class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                       placeholder="nguyenvana1234" required minlength="4" maxlength="50"
                       pattern="[a-zA-Z0-9_]+"
                       title="Chỉ dùng chữ cái, số và dấu gạch dưới, tối thiểu 4 ký tự" />
                <p class="mt-1 text-xs text-gray-500">Chỉ dùng chữ cái, số và dấu gạch dưới (_). Tối thiểu 4 ký tự.</p>
              </div>

              <!-- Email -->
              <div>
                <label for="emailPrefix" class="block mb-1.5 text-sm font-medium text-gray-900">
                  Địa chỉ hộp thư <span class="text-red-500">*</span>
                </label>
                <div class="flex">
                  <input type="text" id="emailPrefix"
                         class="rounded-none rounded-l-lg bg-gray-50 border border-gray-300 text-gray-900 text-sm focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                         placeholder="dfhwidhfked" required pattern="[a-zA-Z0-9._\-]+"
                         title="Chỉ dùng chữ cái, số, dấu chấm và gạch dưới" />
                  <span class="inline-flex items-center px-3.5 text-sm font-semibold text-blue-800 bg-blue-50 border border-l-0 border-blue-200 rounded-r-lg whitespace-nowrap">
                    @domain1.com
                  </span>
                </div>
                <input type="hidden" name="email" id="emailHidden" />
                <p id="emailHint" class="mt-1 text-xs text-gray-500">Hộp thư nội bộ dùng để đăng nhập, gửi và nhận thư</p>
              </div>

              <!-- Mật khẩu -->
              <div>
                <label for="password" class="block mb-1.5 text-sm font-medium text-gray-900">
                  Mật khẩu <span class="text-red-500">*</span>
                  <span class="text-xs font-normal text-gray-500">(tối thiểu 6 ký tự)</span>
                </label>
                <div class="relative">
                  <input type="password" name="matkhau" id="password"
                         class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 pr-10"
                         placeholder="••••••••" required minlength="6"
                         oninput="onPasswordInput(this.value)"
                         onkeyup="onPasswordInput(this.value)"
                         onchange="onPasswordInput(this.value)" />
                  <button type="button" onclick="togglePassword('password', 'eyeIcon1')"
                          class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-700">
                    <svg id="eyeIcon1" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                    </svg>
                  </button>
                </div>
                <!-- Thông báo yêu cầu tối thiểu 6 ký tự -->
                <p id="passwordHint" class="mt-1.5 text-xs text-red-600 font-medium">
                  ⚠️ Mật khẩu phải dài tối thiểu 6 ký tự (hiện có: 0/6 ký tự)
                </p>
                <!-- Thanh độ mạnh mật khẩu -->
                <div id="strengthBar" class="mt-1.5 h-1 w-full bg-gray-200 rounded-full hidden">
                  <div id="strengthFill" class="h-1 rounded-full transition-all duration-300"></div>
                </div>
                <p id="strengthText" class="mt-1 text-xs hidden"></p>
              </div>

              <!-- Xác nhận mật khẩu -->
              <div>
                <label for="confirmPassword" class="block mb-1.5 text-sm font-medium text-gray-900">
                  Nhập lại mật khẩu <span class="text-red-500">*</span>
                </label>
                <div class="relative">
                  <input type="password" name="confirmPassword" id="confirmPassword"
                         class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 pr-10"
                         placeholder="••••••••" required
                         oninput="checkConfirmPassword()"
                         onkeyup="checkConfirmPassword()"
                         onchange="checkConfirmPassword()" />
                  <button type="button" onclick="togglePassword('confirmPassword', 'eyeIcon2')"
                          class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-700">
                    <svg id="eyeIcon2" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                    </svg>
                  </button>
                </div>
                <p id="confirmMsg" class="mt-1 text-xs hidden"></p>
              </div>

              <!-- Họ và tên -->
              <div>
                <label for="name" class="block mb-1.5 text-sm font-medium text-gray-900">
                  Họ và tên <span class="text-red-500">*</span>
                </label>
                <input type="text" name="ten" id="name"
                       class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                       placeholder="Nguyễn Văn A" required />
              </div>

              <!-- Số điện thoại -->
              <div>
                <label for="phoneNumber" class="block mb-1.5 text-sm font-medium text-gray-900">
                  Số điện thoại <span class="text-red-500">*</span>
                </label>
                <input type="tel" name="dt" id="phoneNumber"
                       class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                       placeholder="0123456789" required pattern="[0-9]{9,11}"
                       title="Số điện thoại gồm 9-11 chữ số" />
              </div>

              <!-- Địa chỉ -->
              <div>
                <label for="address" class="block mb-1.5 text-sm font-medium text-gray-900">
                  Địa chỉ
                </label>
                <input type="text" name="diachi" id="address"
                       class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                       placeholder="Hà Nội" />
              </div>

              <!-- Nút đăng ký (mặc định bị chặn nếu mật khẩu dưới 6 ký tự) -->
              <button type="submit" id="btnSubmit" disabled
                      class="w-full text-white bg-gray-400 cursor-not-allowed font-medium rounded-lg text-sm px-5 py-2.5 text-center transition opacity-60">
                Đăng ký
              </button>

              <p class="text-sm font-light text-gray-500">
                Đã có tài khoản?
                <a href="/login" class="font-medium text-blue-600 hover:underline">Đăng nhập</a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script>
      function togglePassword(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input.type === 'password') {
          input.type = 'text';
          icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>';
        } else {
          input.type = 'password';
          icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
        }
      }

      function onPasswordInput(val) {
        checkPasswordStrength(val);
        checkPasswordValidation();
        // Cập nhật lại thông báo so khớp nếu đã nhập ô xác nhận mật khẩu
        const cpw = document.getElementById('confirmPassword').value;
        if (cpw) checkConfirmPassword();
      }

      function checkPasswordValidation() {
        const pw = (document.getElementById('password').value || '').trim();
        const btn = document.getElementById('btnSubmit');
        const hint = document.getElementById('passwordHint');
        const pwInput = document.getElementById('password');

        // Yêu cầu mật khẩu dài tối thiểu 6 ký tự
        if (pw.length < 6) {
          hint.textContent = '⚠️ Mật khẩu phải dài tối thiểu 6 ký tự (hiện có: ' + pw.length + '/6 ký tự)';
          hint.className = 'mt-1.5 text-xs text-red-600 font-medium';
          if (pw.length > 0) {
            pwInput.classList.add('border-red-500', 'focus:ring-red-500', 'focus:border-red-500');
            pwInput.classList.remove('border-green-500', 'focus:ring-green-500', 'focus:border-green-500');
          } else {
            pwInput.classList.remove('border-red-500', 'border-green-500', 'focus:ring-red-500', 'focus:ring-green-500');
          }

          // Chặn nút đăng ký
          btn.disabled = true;
          btn.className = 'w-full text-white bg-gray-400 cursor-not-allowed font-medium rounded-lg text-sm px-5 py-2.5 text-center transition opacity-60 shadow-none';
          return false;
        } else {
          hint.textContent = '✔ Độ dài mật khẩu hợp lệ (' + pw.length + ' ký tự)';
          hint.className = 'mt-1.5 text-xs text-green-600 font-medium';
          pwInput.classList.remove('border-red-500', 'focus:ring-red-500', 'focus:border-red-500');
          pwInput.classList.add('border-green-500', 'focus:ring-green-500', 'focus:border-green-500');

          // Mật khẩu >= 6 ký tự -> Mở chặn nút đăng ký
          btn.disabled = false;
          btn.className = 'w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition cursor-pointer shadow-sm';
          return true;
        }
      }

      function checkPasswordStrength(val) {
        const bar = document.getElementById('strengthBar');
        const fill = document.getElementById('strengthFill');
        const txt = document.getElementById('strengthText');
        if (!val) { bar.classList.add('hidden'); txt.classList.add('hidden'); return; }
        bar.classList.remove('hidden'); txt.classList.remove('hidden');
        let score = 0;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;
        const levels = [
          { w: '25%', color: 'bg-red-500', label: 'Yếu', textClass: 'text-red-600' },
          { w: '50%', color: 'bg-orange-500', label: 'Trung bình', textClass: 'text-orange-600' },
          { w: '75%', color: 'bg-yellow-500', label: 'Khá mạnh', textClass: 'text-yellow-600' },
          { w: '100%', color: 'bg-green-500', label: 'Mạnh', textClass: 'text-green-600' },
        ];
        const lv = levels[Math.max(0, score - 1)];
        fill.style.width = lv.w;
        fill.className = 'h-1 rounded-full transition-all duration-300 ' + lv.color;
        txt.textContent = 'Độ mạnh: ' + lv.label;
        txt.className = 'mt-1 text-xs ' + lv.textClass;
      }

      function checkConfirmPassword() {
        const pw = (document.getElementById('password').value || '').trim();
        const cpw = (document.getElementById('confirmPassword').value || '').trim();
        const msg = document.getElementById('confirmMsg');
        const cpwInput = document.getElementById('confirmPassword');
        if (!cpw) { 
          msg.classList.add('hidden'); 
          cpwInput.classList.remove('border-red-500', 'border-green-500');
          return; 
        }
        msg.classList.remove('hidden');
        if (pw === cpw) {
          msg.textContent = '✔ Mật khẩu khớp';
          msg.className = 'mt-1 text-xs text-green-600 font-medium';
          cpwInput.classList.remove('border-red-500', 'focus:ring-red-500');
          cpwInput.classList.add('border-green-500', 'focus:ring-green-500');
        } else {
          msg.textContent = '✘ Mật khẩu không khớp';
          msg.className = 'mt-1 text-xs text-red-600 font-medium';
          cpwInput.classList.remove('border-green-500', 'focus:ring-green-500');
          cpwInput.classList.add('border-red-500', 'focus:ring-red-500');
        }
      }

      function syncEmailHidden() {
        const prefixInput = document.getElementById('emailPrefix');
        const hiddenInput = document.getElementById('emailHidden');
        if (prefixInput && hiddenInput) {
          const val = prefixInput.value.trim().replace(/@.*$/, '');
          hiddenInput.value = val ? (val + '@domain1.com') : '';
        }
      }

      function validateForm() {
        syncEmailHidden();
        const prefix = document.getElementById('emailPrefix').value.trim();
        if (!prefix) {
          alert('Vui lòng nhập địa chỉ hộp thư!');
          document.getElementById('emailPrefix').focus();
          return false;
        }
        const pw = (document.getElementById('password').value || '').trim();
        const cpw = (document.getElementById('confirmPassword').value || '').trim();
        if (pw.length < 6) {
          alert('Mật khẩu phải có độ dài tối thiểu 6 ký tự (hiện có: ' + pw.length + '/6 ký tự)!');
          document.getElementById('password').focus();
          return false;
        }
        if (pw !== cpw) {
          alert('Mật khẩu nhập lại không khớp! Vui lòng kiểm tra lại.');
          document.getElementById('confirmPassword').focus();
          return false;
        }
        const btn = document.getElementById('btnSubmit');
        btn.disabled = true;
        btn.textContent = 'Đang đăng ký...';
        btn.className = 'w-full text-white bg-blue-400 cursor-not-allowed font-medium rounded-lg text-sm px-5 py-2.5 text-center transition opacity-75';
        return true;
      }

      document.addEventListener('DOMContentLoaded', function() {
        checkPasswordValidation();

        const usernameInput = document.getElementById('username');
        const emailPrefixInput = document.getElementById('emailPrefix');

        if (usernameInput && emailPrefixInput) {
          usernameInput.addEventListener('input', function() {
            if (!emailPrefixInput.dataset.userEdited) {
              emailPrefixInput.value = this.value;
              syncEmailHidden();
            }
          });
          emailPrefixInput.addEventListener('input', function() {
            this.dataset.userEdited = "true";
            syncEmailHidden();
          });
        }
      });
    </script>
  </body>
</html>
