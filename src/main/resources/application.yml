server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
      enabled: true

spring:
  thymeleaf:
    encoding: UTF-8
  datasource:
    url: jdbc:mysql://localhost:3306/mail_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8&useUnicode=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

mailConfig:
  gmail:
    smtp:
      host: smtp.gmail.com
      auth: true
      port: 465
      socketFactory:
        port: 465
        class: javax.net.ssl.SSLSocketFactory

  ptit:
    smtp:
      host: smtp.office365.com
      auth: true
      port: 587
      socketFactory:
        port: 587
        class: javax.net.ssl.SSLSocketFactory
      starttls:
        enable: true

  default:
    smtp:
      auth: true
      host: 127.0.0.1
      port: 587

